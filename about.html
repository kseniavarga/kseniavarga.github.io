<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Ksenia Varga</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1e1e;
      color: white;
      line-height: 1.6;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
      display: flex;
      gap: 60px;
      align-items: center;
      flex-wrap: wrap;
    }
    .text {
      flex: 1;
      min-width: 300px;
    }
    .text h1 {
      font-size: 3.2rem;
      margin-bottom: 20px;
    }
    .photo {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    .photo img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .nav-list {
      margin-top: 30px;
      font-size: 1.1rem;
      list-style: none;
    }
    .nav-list li {
      margin-bottom: 10px;
    }
    .nav-list a {
      color: #00f0ff;
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .nav-list a:hover {
      color: #7df9ff;
      border-bottom-color: #7df9ff;
    }
    .nav-list .pending {
      font-weight: 700;
      color: #ccc;
    }
    .nav-list .pending::after {
      content: " (coming soon)";
      font-weight: 400;
      font-size: 0.85rem;
      color: #777;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 60px;
    }
    .card {
      background: #2a2a2a;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-8px); }
    .connect {
      text-align: center;
      padding: 60px 20px;
      background: #111;
    }
    .connect a {
      color: #00f0ff;
      margin: 0 15px;
      text-decoration: none;
    }
    .connect a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="text">
      <h1>Hello!</h1>
      <p>And passionate about exploring light, materials, semiconductors and quantum frontiers. This website showcases selected projects and experiences from my journey across chemistry and photonics.</p>

      <!-- Filled automatically from site-pages.js -->
      <ul class="nav-list" id="site-nav" aria-label="Site sections"></ul>
    </div>

    <div class="photo">
      <img src="your-photo.png" alt="Ksenia Varga">
    </div>
  </div>

  <div class="connect">
    <h2>Let’s connect and collaborate!</h2>
    <p style="margin-top: 20px;">
      <a href="https://linkedin.com/in/kseniavarga" target="_blank" rel="noopener">LinkedIn</a> •
      <a href="https://x.com/bzimpy" target="_blank" rel="noopener">X / Twitter</a>
    </p>
  </div>

  <script src="site-pages.js"></script>
  <script>
    (function () {
      var nav = document.getElementById("site-nav");
      var pages = (window.SITE_PAGES || []).slice().sort(function (a, b) {
        return (a.order || 0) - (b.order || 0);
      });

      pages.forEach(function (page) {
        var li = document.createElement("li");
        if (page.href) {
          var a = document.createElement("a");
          a.href = page.href;
          a.textContent = page.label;
          li.appendChild(a);
        } else {
          var span = document.createElement("span");
          span.className = "pending";
          span.textContent = page.label;
          li.appendChild(span);
        }
        nav.appendChild(li);
      });
    })();
  </script>

</body>
</html>

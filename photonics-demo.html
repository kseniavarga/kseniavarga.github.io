<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photonics Demo - Waveguide</title>
  <style> body { margin:0; overflow:hidden; background:#000; } </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Simple waveguide box
    const waveguide = new THREE.Mesh(
      new THREE.BoxGeometry(8, 1, 1),
      new THREE.MeshPhongMaterial({color: 0x00aaff, transparent:true, opacity:0.6})
    );
    scene.add(waveguide);

    // Light wave (particles)
    const particles = new THREE.Points(
      new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(new Array(300).fill(0), 3)),
      new THREE.PointsMaterial({color: 0xffff00, size: 0.08})
    );
    scene.add(particles);

    camera.position.set(0, 4, 8);
    camera.lookAt(0,0,0);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light);

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.03;
      
      // Animate light particles along waveguide
      const pos = particles.geometry.attributes.position.array;
      for(let i = 0; i < pos.length; i += 3) {
        pos[i] = (t * 2 + i) % 9 - 4.5;   // move along x
        pos[i+1] = Math.sin(t*3 + i) * 0.3; // wave in y
      }
      particles.geometry.attributes.position.needsUpdate = true;
      
      renderer.render(scene, camera);
    }
    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

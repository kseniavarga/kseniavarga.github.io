<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon Projects — Ksenia Varga</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #1e1e1e;
      background-image: url('Muted background.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .site-nav a {
      color: #eee;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .site-nav a:hover,
    .site-nav a.active {
      color: white;
      background: rgba(255, 255, 255, 0.12);
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="education.html">Education</a>
    <a href="work_experience.html">Select Work Experience</a>
    <a href="chemistry.html">Chemistry Projects</a>
    <a href="photonics-demo.html" class="active">Photon Projects</a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0.45);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const waveguide = new THREE.Mesh(
      new THREE.BoxGeometry(8, 1, 1),
      new THREE.MeshPhongMaterial({ color: 0x00aaff, transparent: true, opacity: 0.6 })
    );
    scene.add(waveguide);

    const particles = new THREE.Points(
      new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(new Array(300).fill(0), 3)),
      new THREE.PointsMaterial({ color: 0xffff00, size: 0.08 })
    );
    scene.add(particles);

    camera.position.set(0, 4, 8);
    camera.lookAt(0, 0, 0);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light);

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.03;
      const pos = particles.geometry.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) {
        pos[i] = (t * 2 + i) % 9 - 4.5;
        pos[i + 1] = Math.sin(t * 3 + i) * 0.3;
      }
      particles.geometry.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
